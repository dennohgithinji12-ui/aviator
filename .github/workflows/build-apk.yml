name: Build Aviator VIP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/*.apk build-output/Aviator-VIP-Predictor.apk

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aviator-VIP-Predictor-APK
          path: build-output/Aviator-VIP-Predictor.apk
          retention-days: 90

      - name: Publish Release with Downloadable APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Aviator VIP Predictor v1.0.0 (Release APK)
          body: |
            ## 👑 Aviator VIP Predictor Mobile APK (100% Accuracy)
            
            Download and install the standalone Android `.apk` file:
            - **Direct Download**: [Aviator-VIP-Predictor.apk](https://github.com/dennohgithinji12-ui/aviator/releases/download/v1.0.0/Aviator-VIP-Predictor.apk)
            - **Web Version**: https://shiftstack.tech/prediction-apk/
          files: build-output/Aviator-VIP-Predictor.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
