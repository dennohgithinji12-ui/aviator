<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgVipGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a1f0a"/>
      <stop offset="50%" stop-color="#121008"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="35%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d1c"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="50%" stop-color="#ff003b"/>
      <stop offset="100%" stop-color="#990022"/>
    </linearGradient>
    <filter id="vipGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="116" fill="url(#bgVipGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#goldSheen)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Radar Rings -->
  <circle cx="256" cy="265" r="185" fill="none" stroke="rgba(255, 215, 0, 0.12)" stroke-width="2"/>
  <circle cx="256" cy="265" r="135" fill="none" stroke="rgba(255, 215, 0, 0.22)" stroke-width="2" stroke-dasharray="10 6"/>
  <circle cx="256" cy="265" r="80" fill="none" stroke="rgba(255, 0, 59, 0.25)" stroke-width="2"/>

  <!-- Crosshairs -->
  <line x1="256" y1="70" x2="256" y2="460" stroke="rgba(255, 215, 0, 0.15)" stroke-width="2"/>
  <line x1="60" y1="265" x2="452" y2="265" stroke="rgba(255, 215, 0, 0.15)" stroke-width="2"/>

  <!-- Golden VIP Crown Header -->
  <g transform="translate(216, 44) scale(1.6)" filter="url(#vipGlow)">
    <path d="M 5 28 L 10 12 L 20 20 L 25 6 L 30 20 L 40 12 L 45 28 Z" fill="url(#goldSheen)"/>
    <circle cx="10" cy="10" r="2" fill="#ffffff"/>
    <circle cx="25" cy="4" r="2.5" fill="#ffffff"/>
    <circle cx="40" cy="10" r="2" fill="#ffffff"/>
    <rect x="5" y="28" width="40" height="4" rx="2" fill="#b8860b"/>
  </g>

  <!-- Glowing Flight Trajectory Arc -->
  <path d="M 120 375 Q 220 365 270 280 T 385 160" fill="none" stroke="#ff003b" stroke-width="7" filter="url(#vipGlow)"/>

  <!-- Red Sports Airplane Silhouette -->
  <g transform="translate(255, 205) rotate(-22) scale(1.75)">
    <!-- Fuselage -->
    <path d="M 40 0 C 25 -10, -15 -10, -35 -4 L -45 -22 L -50 -20 L -40 2 L -35 6 C -15 12, 25 8, 40 0 Z" fill="url(#planeGrad)" filter="url(#vipGlow)"/>
    <!-- Wing -->
    <path d="M 10 2 L -18 24 L -25 22 L -6 0 Z" fill="#ff2b5a"/>
    <!-- Gold Canopy -->
    <path d="M 22 -3 C 16 -8, 6 -8, 2 -3 L 5 0 L 20 0 Z" fill="url(#goldSheen)"/>
    <!-- Propeller Hub & Blades -->
    <rect x="38" y="-20" width="4" height="40" rx="2" fill="#ffffff"/>
    <circle cx="40" cy="0" r="4.5" fill="#ffffff"/>
  </g>

  <!-- VIP 100% Guaranteed Badge -->
  <rect x="136" y="394" width="240" height="52" rx="26" fill="#0c0d12" stroke="url(#goldSheen)" stroke-width="3" filter="url(#vipGlow)"/>
  <text x="256" y="428" font-family="'Outfit', 'Inter', sans-serif" font-size="22" font-weight="900" fill="url(#goldSheen)" text-anchor="middle" letter-spacing="2">VIP 100% STOP</text>
</svg>
